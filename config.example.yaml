# OpenTW configuration (no secrets here; secrets live in .env only).

# API base URL; the API_BASE_URL env var takes precedence over this value.
api_base_url: https://api.example.com

# Monitoring interval (the first cycle starts right after startup).
interval: 15m

# HTTP timeout for one probe request. Reasoning models can be slow
# (a live measurement showed up to ~55s), so headroom is mandatory.
http_timeout: 120s

# Maximum simultaneous model checks.
concurrency: 4

# Output token limit for the probe request. 256 gives reasoning models
# the budget to finish reasoning and produce the final answer; success
# still requires exactly "OK" in the user-facing content.
max_tokens: 256

# Use streaming: it measures TTFT/TPS (stored in the check history).
# false — latency only. The success check (the "OK" answer) does not
# depend on this.
streaming: true

# SQLite database path.
sqlite_path: /data/opentw.db

# Monitored models: exact model IDs from the API catalog, grouped into
# families for display. A model that disappeared from the catalog is still
# probed with a real request: the actual API answer is recorded. New models
# are added by editing this list (the catalog comes from GET /v1/models).
models:
  - family: GPT
    ids:
      - gpt-6-astra
      - gpt-6.1-sol
      - gpt-6-sol
  - family: Claude
    ids:
      - claude-opus-5.5
      - claude-fable-5.1
      - claude-opus-5
  - family: GLM
    ids:
      - glm-5.3
      - glm-5.3-prime
      - glm-5.3-flash
      - glm-5.3-fast
  - family: DeepSeek
    ids:
      - deepseek-v4.1-flash
      - deepseek-v4-pro
      - deepseek-v4.1-flash-1017
  - family: Qwen
    ids:
      - qwen3.8-max
      - qwen3.8-flash
      - qwen3.8-omni-flash
  - family: Kimi
    ids:
      - kimi-k3
      - kimi-k2.6
      - kimi-k2.5
  - family: MiniMax
    ids:
      - minimax-m3
      - minimax-m2.7
      - minimax-m2.5
  - family: Grok
    ids:
      - grok-4.7
      - grok-4.6
      - grok-4.5
