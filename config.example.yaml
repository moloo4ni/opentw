# OpenTW — конфигурация (без секретов; секреты только в .env).

# Базовый URL API; ENV API_BASE_URL имеет приоритет над этим значением.
api_base_url: https://kube943.prod.tonworld.ru

# Интервал мониторинга (первый цикл стартует сразу после запуска).
interval: 15m

# HTTP timeout для одного запроса проверки. Reasoning-модели бывают
# медленными (живой замер: до ~55с), поэтому запас обязателен.
http_timeout: 120s

# Максимум одновременных проверок моделей.
concurrency: 4

# Лимит выходных токенов тестового запроса.
# 256 даёт reasoning-моделям бюджет успеть завершить рассуждение и выдать
# итоговый ответ; успех по-прежнему требует ровно «OK» в пользовательском content.
max_tokens: 256

# Использовать streaming: он измеряет TTFT/TPS (сохраняются в истории проверок).
# false — только latency. Проверка успешности (ответ «OK») не зависит от этого.
streaming: true

# Путь к SQLite.
sqlite_path: /data/opentw.db

# Мониторируемые модели: точные model ID из каталога API, сгруппированные
# по семействам для отображения. Модель, исчезнувшая из каталога, всё
# равно проверяется реальным запросом: фиксируется настоящий ответ API.
# Новые модели добавляются правкой этого списка (перечень берётся из GET /v1/models).
models:
  - family: GPT
    ids:
      - gpt-6-astra
      - gpt-6.1-sol
      - gpt-6-sol
  - family: Claude
    ids:
      - claude-opus-5.5
      - claude-fable-5.1
      - claude-opus-5
  - family: GLM
    ids:
      - glm-5.3
      - glm-5.3-prime
      - glm-5.3-flash
      - glm-5.3-fast
  - family: DeepSeek
    ids:
      - deepseek-v4.1-flash
      - deepseek-v4-pro
      - deepseek-v4.1-flash-1017
  - family: Qwen
    ids:
      - qwen3.8-max
      - qwen3.8-flash
      - qwen3.8-omni-flash
  - family: Kimi
    ids:
      - kimi-k3
      - kimi-k2.6
      - kimi-k2.5
  - family: MiniMax
    ids:
      - minimax-m3
      - minimax-m2.7
      - minimax-m2.5
  - family: Grok
    ids:
      - grok-4.7
      - grok-4.6
      - grok-4.5
